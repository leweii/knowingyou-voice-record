name: KnowingYou

options:
  bundleIdPrefix: com.jakobhe
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.1

targets:
  KnowingYou:
    type: application
    platform: macOS
    sources:
      - path: KnowingYou
        excludes:
          - "Resources/Info.plist"
          - "Resources/KnowingYou.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakobhe.knowingyou
        PRODUCT_NAME: KnowingYou
        INFOPLIST_FILE: KnowingYou/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: KnowingYou/Resources/KnowingYou.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KeyboardShortcuts

  KnowingYouTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KnowingYouTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakobhe.knowingyou.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KnowingYou

schemes:
  KnowingYou:
    build:
      targets:
        KnowingYou: all
        KnowingYouTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KnowingYouTests
